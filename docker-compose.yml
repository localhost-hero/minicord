services:
  backend:
    build:
      context: ./backend
    environment:
      BACKEND_ADDR: ${BACKEND_ADDR:-:8080}
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://livekit:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-replace-with-local-key}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-replace-with-local-secret}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
