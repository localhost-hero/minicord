services:
  backend:
    build:
      context: ./backend
    container_name: minicord-backend
    environment:
      BACKEND_ADDR: ${BACKEND_ADDR:-:8080}
      # Must be reachable from the browser, not just from other containers.
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://localhost:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-replace-with-local-key}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-replace-with-local-secret}
    ports:
      - "8080:8080"
    networks:
      - default
      - caddy

  frontend:
    build:
      context: ./frontend
    container_name: minicord-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - default
      - caddy

  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

networks:
  caddy:
    external: true

